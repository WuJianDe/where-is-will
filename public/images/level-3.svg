<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="280" fill="#87CEEB"/>
  <!-- Sea -->
  <rect y="280" width="800" height="120" fill="#1565C0"/>
  <rect y="280" width="800" height="15"  fill="#1976D2" opacity="0.5"/>
  <!-- Sand -->
  <rect y="380" width="800" height="120" fill="#F9E4B7"/>

  <!-- Sun -->
  <circle cx="700" cy="80" r="50" fill="#FDD835"/>
  <g stroke="#FDD835" stroke-width="4" fill="none">
    <line x1="700" y1="15"  x2="700" y2="5"/>
    <line x1="700" y1="145" x2="700" y2="155"/>
    <line x1="635" y1="80"  x2="625" y2="80"/>
    <line x1="765" y1="80"  x2="775" y2="80"/>
    <line x1="646" y1="34"  x2="638" y2="26"/>
    <line x1="754" y1="126" x2="762" y2="134"/>
    <line x1="754" y1="34"  x2="762" y2="26"/>
    <line x1="646" y1="126" x2="638" y2="134"/>
  </g>

  <!-- Beach umbrellas -->
  <!-- Umbrella 1: red -->
  <ellipse cx="100" cy="350" rx="60" ry="20" fill="#E53935"/>
  <rect x="97" y="350" width="6" height="60" fill="#795548"/>
  <!-- Umbrella 2: blue -->
  <ellipse cx="260" cy="345" rx="55" ry="18" fill="#1565C0"/>
  <rect x="257" y="345" width="6" height="55" fill="#795548"/>
  <!-- Umbrella 3: yellow -->
  <ellipse cx="450" cy="355" rx="60" ry="20" fill="#F9A825"/>
  <rect x="447" y="355" width="6" height="60" fill="#795548"/>
  <!-- Umbrella 4: green -->
  <ellipse cx="640" cy="348" rx="55" ry="18" fill="#2E7D32"/>
  <rect x="637" y="348" width="6" height="55" fill="#795548"/>

  <!-- Towels -->
  <rect x="55"  y="400" width="90"  height="30" fill="#FF8A65" rx="3"/>
  <rect x="215" y="398" width="85"  height="28" fill="#AB47BC" rx="3"/>
  <rect x="600" y="402" width="85"  height="28" fill="#29B6F6" rx="3"/>

  <!-- People (lying/standing on beach) -->
  <!-- Person 1: lying, red swimsuit -->
  <g transform="translate(90, 415)">
    <ellipse cx="0" cy="0" rx="12" ry="9" fill="#FFCC80"/>
    <rect x="12" y="-5" width="40" height="10" fill="#E53935" rx="3"/>
    <ellipse cx="55" cy="0" rx="7" ry="5" fill="#FFCC80"/>
  </g>
  <!-- Person 2: standing, green shirt -->
  <g transform="translate(200, 380)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#2E7D32" rx="2"/>
    <rect x="-9"  y="-3"  width="8"  height="22" fill="#795548"/>
    <rect x="1"   y="-3"  width="8"  height="22" fill="#795548"/>
  </g>
  <!-- Person 3: standing, orange shirt -->
  <g transform="translate(380, 383)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#FF6F00" rx="2"/>
    <rect x="-10" y="0"   width="9"  height="22" fill="#795548"/>
    <rect x="1"   y="0"   width="9"  height="22" fill="#795548"/>
  </g>
  <!-- Person 4: lying, purple swimsuit -->
  <g transform="translate(620, 420)">
    <ellipse cx="0" cy="0" rx="12" ry="9" fill="#FFCC80"/>
    <rect x="12" y="-5" width="38" height="10" fill="#6A1B9A" rx="3"/>
    <ellipse cx="53" cy="0" rx="7" ry="5" fill="#FFCC80"/>
  </g>
  <!-- Person 5: standing, pink shirt -->
  <g transform="translate(700, 380)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#E91E63" rx="2"/>
    <rect x="-9"  y="-3"  width="8"  height="22" fill="#795548"/>
    <rect x="1"   y="-3"  width="8"  height="22" fill="#795548"/>
  </g>

  <!-- 威力 at 28.9%, 71.4% = (231, 357) -->
  <g transform="translate(231, 397)">
    <circle cx="0" cy="-40" r="13" fill="#FFCC80"/>
    <!-- White hat -->
    <rect x="-9" y="-58" width="18" height="8"  fill="#fff"/>
    <rect x="-6" y="-70" width="12" height="14" fill="#fff"/>
    <!-- Striped shirt -->
    <rect x="-11" y="-27" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-22" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-17" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-12" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-7"  width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-2"  width="22" height="3" fill="#fff"/>
    <rect x="-11" y="1"   width="10" height="24" fill="#1565C0"/>
    <rect x="1"   y="1"   width="10" height="24" fill="#1565C0"/>
    <!-- Glasses -->
    <rect x="-8" y="-43" width="5" height="4" fill="#333" rx="1"/>
    <rect x="3"  y="-43" width="5" height="4" fill="#333" rx="1"/>
  </g>

  <!-- Waves -->
  <g fill="none" stroke="white" stroke-width="2" opacity="0.4">
    <path d="M0,300 Q50,290 100,300 T200,300 T300,300 T400,300 T500,300 T600,300 T700,300 T800,300"/>
    <path d="M0,320 Q50,310 100,320 T200,320 T300,320 T400,320 T500,320 T600,320 T700,320 T800,320"/>
  </g>

  <!-- Label -->
  <rect x="0" y="0" width="210" height="30" fill="rgba(0,0,0,0.5)"/>
  <text x="10" y="20" font-family="sans-serif" font-size="13" fill="white">第三關：沙灘派對（佔位圖）</text>
</svg>
