<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.6">
    <circle cx="100" cy="80" r="2"/>
    <circle cx="250" cy="40" r="1.5"/>
    <circle cx="400" cy="100" r="2"/>
    <circle cx="600" cy="60" r="1.5"/>
    <circle cx="750" cy="30" r="2"/>
    <circle cx="900" cy="90" r="1.5"/>
    <circle cx="1050" cy="50" r="2"/>
    <circle cx="1150" cy="110" r="1.5"/>
    <circle cx="180" cy="150" r="1"/>
    <circle cx="500" cy="140" r="1.5"/>
    <circle cx="800" cy="130" r="1"/>
    <circle cx="1100" cy="160" r="1.5"/>
  </g>

  <!-- City silhouette -->
  <g fill="#0f3460">
    <rect x="0"    y="500" width="80"  height="300"/>
    <rect x="80"   y="420" width="60"  height="380"/>
    <rect x="140"  y="480" width="40"  height="320"/>
    <rect x="200"  y="380" width="90"  height="420"/>
    <rect x="300"  y="450" width="50"  height="350"/>
    <rect x="360"  y="400" width="70"  height="400"/>
    <rect x="450"  y="460" width="55"  height="340"/>
    <rect x="520"  y="350" width="100" height="450"/>
    <rect x="640"  y="420" width="60"  height="380"/>
    <rect x="720"  y="380" width="80"  height="420"/>
    <rect x="820"  y="440" width="45"  height="360"/>
    <rect x="880"  y="360" width="90"  height="440"/>
    <rect x="990"  y="430" width="60"  height="370"/>
    <rect x="1070" y="390" width="75"  height="410"/>
    <rect x="1160" y="460" width="40"  height="340"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="700" width="1200" height="100" fill="#0a0a1a"/>

  <!-- Title text -->
  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="900" fill="white" opacity="0.9">威力在哪裡？</text>
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif" font-size="28" fill="rgba(255,255,255,0.5)">找出藏在人群中的神秘人物</text>
</svg>
