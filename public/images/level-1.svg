<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Sky -->
  <rect width="800" height="300" fill="#87CEEB"/>
  <!-- Ground / Grass -->
  <rect y="300" width="800" height="200" fill="#4CAF50"/>
  <!-- Path -->
  <rect x="340" y="280" width="120" height="220" fill="#C8A870"/>

  <!-- Trees -->
  <g>
    <rect x="50" y="200" width="20" height="100" fill="#5D4037"/>
    <circle cx="60" cy="190" r="45" fill="#2E7D32"/>
    <rect x="150" y="220" width="16" height="80" fill="#5D4037"/>
    <circle cx="158" cy="212" r="35" fill="#388E3C"/>
    <rect x="650" y="190" width="22" height="110" fill="#5D4037"/>
    <circle cx="661" cy="178" r="50" fill="#2E7D32"/>
    <rect x="720" y="215" width="18" height="85" fill="#5D4037"/>
    <circle cx="729" cy="206" r="38" fill="#388E3C"/>
  </g>

  <!-- Bench -->
  <rect x="220" y="295" width="80" height="8"  fill="#795548"/>
  <rect x="228" y="303" width="8"  height="20" fill="#795548"/>
  <rect x="284" y="303" width="8"  height="20" fill="#795548"/>

  <!-- People (various colored shirts) -->
  <!-- Person 1: blue shirt -->
  <g transform="translate(100,250)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#1565C0" rx="3"/>
    <rect x="-10" y="0"   width="9"  height="25" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="25" fill="#37474F"/>
  </g>
  <!-- Person 2: green shirt -->
  <g transform="translate(170,260)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#2E7D32" rx="3"/>
    <rect x="-9"  y="-3"  width="8"  height="22" fill="#37474F"/>
    <rect x="1"   y="-3"  width="8"  height="22" fill="#37474F"/>
  </g>
  <!-- Person 3: orange shirt -->
  <g transform="translate(490,255)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#E65100" rx="3"/>
    <rect x="-10" y="0"   width="9"  height="25" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="25" fill="#37474F"/>
  </g>
  <!-- Person 4: purple shirt -->
  <g transform="translate(560,265)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#6A1B9A" rx="3"/>
    <rect x="-9"  y="-3"  width="8"  height="22" fill="#37474F"/>
    <rect x="1"   y="-3"  width="8"  height="22" fill="#37474F"/>
  </g>
  <!-- Person 5: yellow shirt -->
  <g transform="translate(620,258)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#F9A825" rx="3"/>
    <rect x="-10" y="0"   width="9"  height="25" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="25" fill="#37474F"/>
  </g>
  <!-- Person 6: pink shirt -->
  <g transform="translate(690,262)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#E91E63" rx="3"/>
    <rect x="-9"  y="-3"  width="8"  height="22" fill="#37474F"/>
    <rect x="1"   y="-3"  width="8"  height="22" fill="#37474F"/>
  </g>
  <!-- Person 7: dark blue shirt -->
  <g transform="translate(260,258)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#0D47A1" rx="3"/>
    <rect x="-10" y="0"   width="9"  height="25" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="25" fill="#37474F"/>
  </g>

  <!-- 威力 (Will) - Red and white striped shirt at ~42.5%, 38.2% = (340, 191) -->
  <!-- 威力 is positioned at x=340, y=191 in a 800x500 image -->
  <g transform="translate(340,241)">
    <!-- Red & white striped shirt (威力's signature) -->
    <circle cx="0" cy="-40" r="13" fill="#FFCC80"/>
    <!-- White hat -->
    <rect x="-9" y="-58" width="18" height="8"  fill="#fff"/>
    <rect x="-6" y="-70" width="12" height="14" fill="#fff"/>
    <!-- Striped shirt -->
    <rect x="-11" y="-27" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-22" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-17" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-12" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-7"  width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-2"  width="22" height="3" fill="#fff"/>
    <!-- Pants -->
    <rect x="-11" y="1"   width="10" height="26" fill="#1565C0"/>
    <rect x="1"   y="1"   width="10" height="26" fill="#1565C0"/>
    <!-- Glasses hint -->
    <rect x="-8"  y="-43" width="5"  height="4"  fill="#333" rx="1"/>
    <rect x="3"   y="-43" width="5"  height="4"  fill="#333" rx="1"/>
  </g>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="150" cy="80"  rx="60" ry="25"/>
    <ellipse cx="120" cy="80"  rx="40" ry="20"/>
    <ellipse cx="180" cy="80"  rx="40" ry="20"/>
    <ellipse cx="500" cy="60"  rx="70" ry="28"/>
    <ellipse cx="465" cy="60"  rx="45" ry="22"/>
    <ellipse cx="535" cy="60"  rx="45" ry="22"/>
    <ellipse cx="700" cy="90"  rx="55" ry="22"/>
    <ellipse cx="670" cy="90"  rx="38" ry="18"/>
    <ellipse cx="730" cy="90"  rx="38" ry="18"/>
  </g>

  <!-- Label (placeholder only) -->
  <rect x="0" y="0" width="200" height="30" fill="rgba(0,0,0,0.5)"/>
  <text x="10" y="20" font-family="sans-serif" font-size="13" fill="white">第一關：熱鬧的公園（佔位圖）</text>
</svg>
