<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#FFF8E1"/>
  <!-- Floor -->
  <rect y="380" width="800" height="120" fill="#BCAAA4"/>

  <!-- Market stalls -->
  <!-- Stall 1 -->
  <rect x="20"  y="200" width="120" height="180" fill="#E53935"/>
  <rect x="15"  y="195" width="130" height="15"  fill="#B71C1C"/>
  <rect x="20"  y="215" width="120" height="10"  fill="#FFCDD2"/>
  <!-- Stall 2 -->
  <rect x="180" y="210" width="100" height="170" fill="#1565C0"/>
  <rect x="175" y="205" width="110" height="15"  fill="#0D47A1"/>
  <rect x="180" y="225" width="100" height="10"  fill="#BBDEFB"/>
  <!-- Stall 3 -->
  <rect x="320" y="190" width="130" height="190" fill="#2E7D32"/>
  <rect x="315" y="185" width="140" height="15"  fill="#1B5E20"/>
  <rect x="320" y="205" width="130" height="10"  fill="#C8E6C9"/>
  <!-- Stall 4 -->
  <rect x="490" y="205" width="110" height="175" fill="#F57F17"/>
  <rect x="485" y="200" width="120" height="15"  fill="#E65100"/>
  <rect x="490" y="220" width="110" height="10"  fill="#FFF9C4"/>
  <!-- Stall 5 -->
  <rect x="640" y="215" width="120" height="165" fill="#6A1B9A"/>
  <rect x="635" y="210" width="130" height="15"  fill="#4A148C"/>
  <rect x="640" y="230" width="120" height="10"  fill="#E1BEE7"/>

  <!-- Fruits/goods on stalls -->
  <g fill="#FF5722"><circle cx="55"  cy="260" r="8"/><circle cx="75"  cy="258" r="8"/><circle cx="95"  cy="261" r="8"/><circle cx="115" cy="259" r="8"/></g>
  <g fill="#4CAF50"><circle cx="220" cy="270" r="7"/><circle cx="238" cy="268" r="7"/><circle cx="256" cy="271" r="7"/></g>
  <g fill="#FFEB3B"><circle cx="360" cy="255" r="9"/><circle cx="382" cy="253" r="9"/><circle cx="404" cy="256" r="9"/><circle cx="426" cy="254" r="9"/></g>

  <!-- People in market -->
  <!-- Person 1: blue -->
  <g transform="translate(145,310)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#1565C0" rx="2"/>
    <rect x="-10" y="0"   width="9"  height="22" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="22" fill="#37474F"/>
  </g>
  <!-- Person 2: green -->
  <g transform="translate(290,320)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#388E3C" rx="2"/>
    <rect x="-9"  y="-3"  width="8"  height="20" fill="#37474F"/>
    <rect x="1"   y="-3"  width="8"  height="20" fill="#37474F"/>
  </g>
  <!-- Person 3: pink -->
  <g transform="translate(460,315)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#E91E63" rx="2"/>
    <rect x="-10" y="0"   width="9"  height="22" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="22" fill="#37474F"/>
  </g>
  <!-- Person 4: yellow -->
  <g transform="translate(615,318)">
    <circle cx="0" cy="-40" r="11" fill="#FFCC80"/>
    <rect x="-9"  y="-29" width="18" height="26" fill="#F9A825" rx="2"/>
    <rect x="-9"  y="-3"  width="8"  height="20" fill="#37474F"/>
    <rect x="1"   y="-3"  width="8"  height="20" fill="#37474F"/>
  </g>
  <!-- Person 5: purple -->
  <g transform="translate(760,322)">
    <circle cx="0" cy="-40" r="12" fill="#FFCC80"/>
    <rect x="-10" y="-28" width="20" height="28" fill="#6A1B9A" rx="2"/>
    <rect x="-10" y="0"   width="9"  height="22" fill="#37474F"/>
    <rect x="1"   y="0"   width="9"  height="22" fill="#37474F"/>
  </g>

  <!-- 威力 at 65.3%, 55.7% = (522, 279) -->
  <g transform="translate(522,319)">
    <circle cx="0" cy="-40" r="13" fill="#FFCC80"/>
    <!-- White hat -->
    <rect x="-9" y="-58" width="18" height="8"  fill="#fff"/>
    <rect x="-6" y="-70" width="12" height="14" fill="#fff"/>
    <!-- Striped shirt -->
    <rect x="-11" y="-27" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-22" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-17" width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-12" width="22" height="5" fill="#fff"/>
    <rect x="-11" y="-7"  width="22" height="5" fill="#E53935"/>
    <rect x="-11" y="-2"  width="22" height="3" fill="#fff"/>
    <rect x="-11" y="1"   width="10" height="24" fill="#1565C0"/>
    <rect x="1"   y="1"   width="10" height="24" fill="#1565C0"/>
    <!-- Glasses -->
    <rect x="-8" y="-43" width="5" height="4" fill="#333" rx="1"/>
    <rect x="3"  y="-43" width="5" height="4" fill="#333" rx="1"/>
  </g>

  <!-- Label -->
  <rect x="0" y="0" width="210" height="30" fill="rgba(0,0,0,0.5)"/>
  <text x="10" y="20" font-family="sans-serif" font-size="13" fill="white">第二關：繁忙的市場（佔位圖）</text>
</svg>
